<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Lissajous Curves Deluxe</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="panel">
    <h1>🧬 Lissajous Curves</h1>

    <p>
      Explore animated mathematical curves with glowing trails, presets and real-time controls.
    </p>

    <div class="control">
      <label>Frequency X <span id="freqXValue">3</span></label>
      <input type="range" id="freqX" min="1" max="12" value="3">
    </div>

    <div class="control">
      <label>Frequency Y <span id="freqYValue">2</span></label>
      <input type="range" id="freqY" min="1" max="12" value="2">
    </div>

    <div class="control">
      <label>Phase <span id="phaseValue">1.57</span></label>
      <input type="range" id="phase" min="0" max="628" value="157">
    </div>

    <div class="control">
      <label>Points <span id="pointsValue">1400</span></label>
      <input type="range" id="points" min="300" max="4000" value="1400">
    </div>

    <div class="control">
      <label>Speed <span id="speedValue">0.012</span></label>
      <input type="range" id="speed" min="0" max="50" value="12">
    </div>

    <div class="control">
      <label>Glow <span id="glowValue">18</span></label>
      <input type="range" id="glow" min="0" max="40" value="18">
    </div>

    <div class="buttons">
      <button id="presetBtn">Preset</button>
      <button id="colorBtn">Colors</button>
      <button id="randomBtn">Random</button>
      <button id="clearBtn">Clear</button>
      <button id="saveBtn">Save PNG</button>
    </div>
  </div>

  <div class="hint">
    🖱️ Move mouse = distortion | Click = color change
  </div>

  <script src="script.js"></script>
</body>
</html>
